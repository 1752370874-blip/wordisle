<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172744">
<title>词屿 · 让学习成为你的主场</title>
<link rel="icon" type="image/png" href="assets/wordisle-icon-32.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="youth.css">
<link rel="stylesheet" href="memory-coach.css">
<link rel="stylesheet" href="book-plan.css">
<link rel="stylesheet" href="motion-ui.css">
<link rel="stylesheet" href="account-session.css">
<link rel="stylesheet" href="product-flow.css">
<link rel="stylesheet" href="learner-experience.css">
<link rel="stylesheet" href="reading-club.css">
</head>
<body class="lg youth motion-ui account-pending">
<div class="bg-layer" aria-hidden="true"></div>
<div class="ambient" aria-hidden="true"><span></span></div>
<aside class="rail">
  <div class="brand">
    <img class="brand-mark" src="assets/wordisle-icon.svg" alt="">
    <div class="brand-text">
      <div class="brand-name">词屿</div>
      <div class="brand-sub">PLAY · LEARN · GROW</div>
    </div>
  </div>

  <nav class="nav" id="nav" aria-label="主导航">
    <span class="product-nav-label">我的学习</span>
    <button data-nav="home" class="on"><span class="nav-dot"></span>今日学习</button>
    <button data-nav="decks"><span class="nav-dot"></span>词书广场</button>
    <button data-nav="wrong"><span class="nav-dot"></span>复习巩固</button>
    <span class="product-nav-label">学习工具</span>
    <button data-nav="companion"><span class="nav-dot"></span>AI 伴学</button>
    <button data-nav="listen"><span class="nav-dot"></span>实时听译</button>
    <button data-nav="readings"><span class="nav-dot"></span>外刊阅读</button>
    <button data-nav="dict"><span class="nav-dot"></span>查词</button>
    <details id="productMoreNav" class="product-more-nav"><summary>更多工具</summary><button data-nav="textmap"><span class="nav-dot"></span>文章词汇地图</button></details>
    <div class="product-nav-personal"><button data-nav="stats"><span class="nav-dot"></span>学习记录</button><button data-nav="settings"><span class="nav-dot"></span>设置</button></div>
  </nav>

  <div class="rail-foot">
    <div class="mini-label">今日进度</div>
    <div class="bar"><i id="railBar" style="width:0%"></i></div>
    <div class="mini" id="railText">新词 0 · 复习 0</div>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="viewTitle">今日学习</h1>
      <p id="viewSub" class="sub">先复习到期的词，再学新词</p>
    </div>
    <div class="topbar-right">
      <button class="btn small account-badge" id="accountBadge" data-account-action="profile">我的账号</button>
      <button id="youthQuiet" class="youth-quiet-toggle" data-youth-action="quiet" aria-pressed="false">安静模式</button>
      <div class="chip" id="streakChip">连续 0 天</div>
      <div class="chip ghost" id="todayChip">今日 0 词</div>
    </div>
  </header>

  <section id="view" class="view" aria-live="polite"></section>
</main>

<div id="toast" class="toast" hidden></div>
<div id="youthFeedback" class="youth-feedback" hidden role="status" aria-live="polite" aria-atomic="true"><b aria-hidden="true">✦</b><span></span></div>
<div id="youthConfetti" class="youth-confetti" aria-hidden="true"></div>
<div id="err" class="err" hidden></div>

<noscript><div class="err" style="display:block">这个应用需要启用 JavaScript 才能运行。</div></noscript>

<script src="data/dict-cet4.js"></script>
<script src="data/dict-cet6.js"></script>
<script src="data/dict-kaoyan.js"></script>
<script src="data/dict-ielts.js"></script>
<script src="data/dict-toefl.js"></script>
<script src="data/dict-gre.js"></script>
<script src="data/dict-oxford3000.js"></script>
<script src="data/dict-oxford5000.js"></script>
<script src="data/dict-collins5.js"></script>
<script src="data/books-expanded.js"></script>
<script src="data/readings-a.js"></script>
<script src="data/readings-b.js"></script>
<script src="data/readings-c.js"></script>
<script src="data/readings-d.js"></script>
<script src="data/readings-e.js"></script>
<script src="data/extended-dict/meta.js"></script>
<script src="companion.js"></script>
<script src="listening-tools.js"></script>
<script src="translation-ui.js"></script>
<script src="live-translation.js"></script>
<script src="youth-ui.js"></script>
<script src="memory-scenes.js"></script>
<script src="memory-coach.js"></script>
<script src="review-curve.js"></script>
<script src="book-plan.js"></script>
<script src="motion-ui.js"></script>
<script src="versioning.js"></script>
<script src="study-checkpoint.js"></script>
<script src="product-flow.js"></script>
<script src="feedback-audio.js"></script>
<script src="reading-source-catalog.js"></script>
<script src="reading-library.js"></script>
<script src="reading-source-state.js"></script>
<script src="reading-news.js"></script>
<script src="reading-club.js"></script>
<script src="learner-experience.js"></script>
<script src="account-session.js"></script>
<script src="app.js"></script>
</body>
</html>
