<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="assets/wordisle-icon-32.png"><title>词屿</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #172744;
    color: #f6faf2;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 1px solid #354963;
    border-radius: 14px;
  }
  .card { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { transform: translateY(14px); } to { transform: none; } }
  .logo { width: 86px; height: 86px; object-fit: contain; }
  .name { font-size: 34px; font-weight:850; letter-spacing: 5px; margin-top: 4px; }
  .line { width: 62px; height: 3px; background: #ff9072; margin: 2px 0 4px; transform:skew(-24deg); }
  .tag { font-size: 13px; color: #c8d9db; letter-spacing: 2px; }
  .en { font-size: 9px; font-weight:800; letter-spacing: 3px; color: #d5f568; }
  .tip { position: absolute; bottom: 18px; font-size: 11px; color: #9ab1c4; letter-spacing: 1px; }
  @media(prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/wordisle-icon.svg" alt="词屿">
    <div class="name">词屿</div>
    <div class="line"></div>
    <div class="tag">让学习成为你的主场</div>
    <div class="en">WORDISLE · PLAY & GROW</div>
  </div>
  <div class="tip">正在打开…</div>
</body>
</html>
