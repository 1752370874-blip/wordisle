<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 词屿</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<style>
  :root { --bg:#f6f1e6; --ink:#1f3b36; --muted:#7d7462; --accent:#13655f; --kai:"Kaiti SC","STKaiti","KaiTi",serif; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  main { text-align:left; max-width:460px; padding:32px; }
  .code { font-family:var(--kai); font-size:64px; color:var(--accent); line-height:1; }
  h1 { font-size:26px; margin:12px 0 8px; }
  p { color:var(--muted); line-height:1.8; }
  a { display:inline-block; margin-top:18px; padding:10px 16px; border-radius:10px; background:var(--accent); color:#fffdf8; text-decoration:none; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>这座小岛不存在</h1>
  <p>你访问的页面可能已经被移走，或者链接写错了。回到首页继续背单词吧。</p>
  <a href="./">回到首页</a>
</main>
</body>
</html>
